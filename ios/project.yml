# ============================================================================
# XcodeGen — يولّد مشروع Xcode من هذا الملف (على macOS)
#   brew install xcodegen
#   cd ios && xcodegen generate && open MasarApp.xcodeproj
# ============================================================================
name: MasarApp
options:
  bundleIdPrefix: com.almasar
  deploymentTarget:
    iOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
targets:
  MasarApp:
    type: application
    platform: iOS
    sources:
      - path: MasarApp/Sources
      - path: MasarApp/Resources/www
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.almasar.logistics
        INFOPLIST_FILE: MasarApp/Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
